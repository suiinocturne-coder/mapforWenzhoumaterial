services:
  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
